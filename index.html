<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇遊戲 - Snake Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gameBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#10b981',
                        accentHover: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        canvas {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-3xl md:text-4xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 drop-shadow">
            SNAKE GAME
        </h1>
        <p class="text-slate-400 text-sm mt-1">經典貪吃蛇現代版</p>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col items-center gap-4">
        
        <!-- Score Board -->
        <div class="w-full bg-cardBg/80 backdrop-blur border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-lg">
            <div class="flex flex-col items-center flex-1 border-r border-slate-700">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">當前分數</span>
                <span id="currentScore" class="text-2xl font-black font-orbitron text-emerald-400 mt-0.5">0</span>
            </div>
            <div class="flex flex-col items-center flex-1">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">最高紀錄</span>
                <span id="highScore" class="text-2xl font-black font-orbitron text-cyan-400 mt-0.5">0</span>
            </div>
        </div>

        <!-- Canvas Wrapper -->
        <div class="relative bg-cardBg border-2 border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl p-2">
            <canvas id="gameCanvas" width="360" height="360" class="rounded-xl bg-slate-950 block"></canvas>
            
            <!-- Overlay screens -->
            <div id="startScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center gap-4 p-6 transition-opacity duration-300">
                <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/50 rounded-2xl flex items-center justify-center text-emerald-400 text-3xl shadow-lg shadow-emerald-500/10">
                    🐍
                </div>
                <h2 class="text-xl font-bold tracking-wide">準備好挑戰了嗎？</h2>
                <p class="text-xs text-slate-400 text-center max-w-[240px]">使用方向鍵、WASD 或下方虛擬按鈕控制蛇的方向，吃到食物變長！</p>
                <button onclick="startGame()" class="mt-2 w-full max-w-[200px] bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-emerald-500/25 transition-all transform active:scale-95 font-orbitron tracking-wider">
                    開始遊戲
                </button>
            </div>

            <div id="pauseScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center gap-4 p-6 hidden transition-opacity duration-300">
                <h2 class="text-2xl font-black font-orbitron text-yellow-400 tracking-wider">遊戲暫停</h2>
                <button onclick="resumeGame()" class="w-full max-w-[200px] bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 font-orbitron tracking-wider">
                    繼續遊戲
                </button>
            </div>

            <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-4 p-6 hidden transition-opacity duration-300">
                <div class="w-16 h-16 bg-rose-500/20 border border-rose-500/50 rounded-2xl flex items-center justify-center text-rose-400 text-3xl shadow-lg shadow-rose-500/10">
                    💀
                </div>
                <h2 class="text-2xl font-black font-orbitron text-rose-400 tracking-wider">遊戲結束</h2>
                <div class="text-center">
                    <p class="text-xs text-slate-400">最終得分</p>
                    <p id="finalScore" class="text-3xl font-black font-orbitron text-white mt-1">0</p>
                </div>
                <button onclick="startGame()" class="mt-2 w-full max-w-[200px] bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-emerald-500/25 transition-all transform active:scale-95 font-orbitron tracking-wider">
                    再玩一次
                </button>
            </div>
        </div>

        <!-- Controls / Action Buttons -->
        <div class="w-full flex justify-between items-center gap-3">
            <button id="pauseBtn" onclick="togglePause()" disabled class="flex-1 bg-cardBg hover:bg-slate-800 border border-slate-700 text-slate-300 py-2.5 px-4 rounded-xl font-medium text-sm transition-all shadow disabled:opacity-40 disabled:cursor-not-allowed">
                暫停
            </button>
            <button onclick="resetHighScore()" class="bg-cardBg hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-rose-400 py-2.5 px-4 rounded-xl font-medium text-sm transition-all shadow">
                重置紀錄
            </button>
        </div>

        <!-- On-screen D-Pad for Mobile / Touch -->
        <div class="grid grid-cols-3 gap-2 w-48 mx-auto mt-1 md:hidden">
            <div></div>
            <button ontouchstart="handleTouchDir('UP')" onclick="changeDirection('UP')" class="bg-cardBg hover:bg-slate-800 border border-slate-700 active:bg-emerald-600 active:border-emerald-500 text-white h-14 rounded-xl text-xl flex items-center justify-center shadow">⬆️</button>
            <div></div>
            <button ontouchstart="handleTouchDir('LEFT')" onclick="changeDirection('LEFT')" class="bg-cardBg hover:bg-slate-800 border border-slate-700 active:bg-emerald-600 active:border-emerald-500 text-white h-14 rounded-xl text-xl flex items-center justify-center shadow">⬅️</button>
            <button ontouchstart="handleTouchDir('DOWN')" onclick="changeDirection('DOWN')" class="bg-cardBg hover:bg-slate-800 border border-slate-700 active:bg-emerald-600 active:border-emerald-500 text-white h-14 rounded-xl text-xl flex items-center justify-center shadow">⬇️</button>
            <button ontouchstart="handleTouchDir('RIGHT')" onclick="changeDirection('RIGHT')" class="bg-cardBg hover:bg-slate-800 border border-slate-700 active:bg-emerald-600 active:border-emerald-500 text-white h-14 rounded-xl text-xl flex items-center justify-center shadow">➡️</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-slate-500 py-4">
        使用方向鍵或 WASD 鍵控制 • 享受遊戲！
    </footer>

    <!-- Game Logic Script -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridsize = 20;
        const tileCount = canvas.width / gridsize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let gameSpeed = 120; // ms per tick
        let isPaused = false;
        let isPlaying = false;
        let nextDirection = '';

        // Initialize High Score Display
        document.getElementById('highScore').innerText = highScore;

        // Keyboard Event Listener
        document.addEventListener('keydown', e => {
            if (!isPlaying && (e.key === ' ' || e.key === 'Enter')) {
                startGame();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    e.preventDefault();
                    break;
                case 'p':
                case 'P':
                    if (isPlaying) togglePause();
                    break;
            }
        });

        function changeDirection(direction) {
            if (!isPlaying || isPaused) return;

            if (direction === 'UP' && dy === 0) {
                nextDirection = 'UP';
            } else if (direction === 'DOWN' && dy === 0) {
                nextDirection = 'DOWN';
            } else if (direction === 'LEFT' && dx === 0) {
                nextDirection = 'LEFT';
            } else if (direction === 'RIGHT' && dx === 0) {
                nextDirection = 'RIGHT';
            }
        }

        function handleTouchDir(dir) {
            changeDirection(dir);
        }

        function startGame() {
            // Reset state
            snake = [
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDirection = 'RIGHT';
            score = 0;
            gameSpeed = 120;
            isPaused = false;
            isPlaying = true;

            document.getElementById('currentScore').innerText = score;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('pauseBtn').removeAttribute('disabled');
            document.getElementById('pauseBtn').innerText = '暫停';

            generateFood();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function togglePause() {
            if (!isPlaying) return;

            if (isPaused) {
                resumeGame();
            } else {
                isPaused = true;
                clearInterval(gameInterval);
                document.getElementById('pauseScreen').classList.remove('hidden');
                document.getElementById('pauseBtn').innerText = '繼續';
            }
        }

        function resumeGame() {
            if (!isPlaying || !isPaused) return;
            isPaused = false;
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('pauseBtn').innerText = '暫停';
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            update();
            if (isPlaying) {
                draw();
            }
        }

        function update() {
            // Apply buffered direction
            if (nextDirection) {
                if (nextDirection === 'UP' && dy === 0) { dx = 0; dy = -1; }
                if (nextDirection === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
                if (nextDirection === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
                if (nextDirection === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
                nextDirection = '';
            }

            // Move head
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('currentScore').innerText = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    document.getElementById('highScore').innerText = highScore;
                }

                // Speed up slightly every 50 points
                if (score % 50 === 0 && gameSpeed > 60) {
                    gameSpeed -= 8;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }

                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                valid = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid lines
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridsize, 0);
                ctx.lineTo(i * gridsize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridsize);
                ctx.lineTo(canvas.width, i * gridsize);
                ctx.stroke();
            }

            // Draw Food (Apple with glow effect)
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(
                food.x * gridsize + gridsize / 2,
                food.y * gridsize + gridsize / 2,
                gridsize / 2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Snake
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#34d399' : '#10b981';
                
                if (isHead) {
                    ctx.shadowColor = '#10b981';
                    ctx.shadowBlur = 10;
                }

                // Rounded rectangles for snake parts
                const x = part.x * gridsize + 2;
                const y = part.y * gridsize + 2;
                const size = gridsize - 4;
                const radius = 6;

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, radius);
                ctx.fill();

                if (isHead) {
                    ctx.shadowBlur = 0;
                    // Draw eyes on head
                    ctx.fillStyle = '#020617';
                    let eye1X = x + 5, eye1Y = y + 5;
                    let eye2X = x + 11, eye2Y = y + 5;

                    if (dx === 1) { eye1X = x + 11; eye1Y = y + 5; eye2X = x + 11; eye2Y = y + 11; }
                    else if (dx === -1) { eye1X = x + 5; eye1Y = y + 5; eye2X = x + 5; eye2Y = y + 11; }
                    else if (dy === 1) { eye1X = x + 5; eye1Y = y + 11; eye2X = x + 11; eye2Y = y + 11; }
                    else if (dy === -1) { eye1X = x + 5; eye1Y = y + 5; eye2X = x + 11; eye2Y = y + 5; }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
                    ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('pauseBtn').setAttribute('disabled', 'true');
        }

        function resetHighScore() {
            if (confirm('確定要重置最高分紀錄嗎？')) {
                localStorage.removeItem('snakeHighScore');
                highScore = 0;
                document.getElementById('highScore').innerText = 0;
            }
        }

        // Initial draw on load
        draw();
    </script>
</body>
</html>
